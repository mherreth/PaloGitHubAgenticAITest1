name: Terraform Apply

on:
  push:
    branches: [ main ]

concurrency:
  group: panorama-dg1-apply
  cancel-in-progress: false

jobs:
  plan:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan
        run: terraform plan -input=false -parallelism=1 `
          -replace=panos_panorama_security_rule_group.example1 `
          -replace=panos_panorama_security_rule_group.example2

  apply:
    needs: plan
    runs-on: self-hosted
    environment: panorama-production
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan after approval
        run: terraform plan -input=false -parallelism=1 -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -parallelism=1 -auto-approve tfplan

      - name: Push production configuration to Panorama DG1
        shell: powershell
        env:
          PANOS_HOSTNAME: ${{ secrets.PANOS_HOSTNAME }}
          PANOS_USERNAME: ${{ secrets.PANOS_USERNAME }}
          PANOS_PASSWORD: ${{ secrets.PANOS_PASSWORD }}
          PANOS_DEVICE_GROUP: DG1
          PANOS_COMMIT_DESCRIPTION: Terraform apply ${{ github.sha }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./commit.ps1
