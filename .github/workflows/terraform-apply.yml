name: Terraform Apply

on:
  push:
    branches: [ main ]

jobs:
  plan:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan
        run: terraform plan -input=false

  approval:
    needs: plan
    runs-on: self-hosted
    environment: panorama-production
    timeout-minutes: 15
    steps:
      - name: Approval granted
        run: Write-Output "Approval granted. Terraform apply may proceed."

  apply:
    needs: approval
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan after approval
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Commit candidate configuration to Panorama
        shell: powershell
        run: |
          $apiUrl = "https://${env:TF_VAR_panorama-server}/api"
          $keygenContent = & curl.exe --silent --show-error --fail --insecure --request POST `
            --data-urlencode "type=keygen" `
            --data-urlencode "user=$env:TF_VAR_username" `
            --data-urlencode "password=$env:TF_VAR_password" `
            $apiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Panorama API key generation request failed"
          }
          $key = ([xml]$keygenContent).response.result.key
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "Panorama did not return an API key"
          }

          $commitContent = & curl.exe --silent --show-error --fail --insecure --request POST `
            --data-urlencode "type=commit" `
            --data-urlencode "key=$key" `
            --data-urlencode "cmd=<commit><description>Terraform apply $env:GITHUB_SHA</description><partial><device-group><entry name='DG1'/></device-group></partial></commit>" `
            $apiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Panorama commit request failed"
          }
          $commitResponse = [xml]$commitContent
          if ($commitResponse.response.status -ne "success") {
            throw "Panorama commit request failed: $commitContent"
          }
          $jobId = $commitResponse.response.result.job
          if ([string]::IsNullOrWhiteSpace($jobId)) {
            throw "Panorama did not return a commit job ID"
          }

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Start-Sleep -Seconds 10
            $jobContent = & curl.exe --silent --show-error --fail --insecure --request POST `
              --data-urlencode "type=op" `
              --data-urlencode "key=$key" `
              --data-urlencode "cmd=<show><jobs><id>$jobId</id></jobs></show>" `
              $apiUrl
            if ($LASTEXITCODE -ne 0) {
              throw "Panorama commit status request failed"
            }
            $jobResponse = [xml]$jobContent
            $job = $jobResponse.response.result.job
            Write-Output "Panorama commit job $jobId status: $($job.status)"
            if ($job.status -eq "FIN") {
              if ($job.result -ne "OK") {
                throw "Panorama commit job failed: $jobContent"
              }
              Write-Output "Panorama commit job $jobId completed successfully."
              exit 0
            }
          }
          throw "Panorama commit job $jobId did not finish within 5 minutes"
