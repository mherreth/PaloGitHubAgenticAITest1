name: Terraform Apply

on:
  push:
    branches: [ main ]

concurrency:
  group: panorama-dg1-apply
  cancel-in-progress: false

jobs:
  plan:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan -input=false -parallelism=1 `
            -replace=panos_panorama_security_rule_group.example1 `
            -replace=panos_panorama_security_rule_group.example2 `
            -replace=panos_panorama_address_object.webhost-1 `
            -replace=panos_panorama_address_object.webhost-2 `
            -replace=panos_panorama_address_object.webhost-3 `
            -replace=panos_panorama_address_object.webhost-4 `
            -replace=panos_panorama_address_object.webhost-5 `
            -replace=panos_panorama_address_object.webhost-6 `
            -replace=panos_panorama_address_object.webhost-7 `
            -replace=panos_panorama_address_object.webhost-11 `
            -replace=panos_panorama_address_object.webhost-12 `
            -replace=panos_panorama_address_object.webhost-13 `
            -replace=panos_panorama_address_object.webhost-14 `
            -replace=panos_panorama_address_object.webhost-15 `
            -replace=panos_panorama_address_object.webhost-16

  apply:
    needs: plan
    runs-on: self-hosted
    environment: panorama-production
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan after approval
        shell: powershell
        run: |
          terraform plan -input=false -parallelism=1 `
            -replace=panos_panorama_security_rule_group.example1 `
            -replace=panos_panorama_security_rule_group.example2 `
            -replace=panos_panorama_address_object.webhost-1 `
            -replace=panos_panorama_address_object.webhost-2 `
            -replace=panos_panorama_address_object.webhost-3 `
            -replace=panos_panorama_address_object.webhost-4 `
            -replace=panos_panorama_address_object.webhost-5 `
            -replace=panos_panorama_address_object.webhost-6 `
            -replace=panos_panorama_address_object.webhost-7 `
            -replace=panos_panorama_address_object.webhost-11 `
            -replace=panos_panorama_address_object.webhost-12 `
            -replace=panos_panorama_address_object.webhost-13 `
            -replace=panos_panorama_address_object.webhost-14 `
            -replace=panos_panorama_address_object.webhost-15 `
            -replace=panos_panorama_address_object.webhost-16 `
            -out=tfplan
          $planOutput = terraform show -no-color tfplan
          $planText = $planOutput -join [Environment]::NewLine
          $planText

      - name: Terraform Apply
        run: terraform apply -input=false -parallelism=1 -auto-approve tfplan

      - name: Commit Panorama configuration for DG1
        shell: powershell
        env:
          PANOS_HOSTNAME: ${{ secrets.PANOS_HOSTNAME }}
          PANOS_USERNAME: ${{ secrets.PANOS_USERNAME }}
          PANOS_PASSWORD: ${{ secrets.PANOS_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $apiUrl = "https://$env:PANOS_HOSTNAME/api"
          $deviceGroup = "DG1"
          $description = "Terraform apply $env:GITHUB_SHA"

          if ([string]::IsNullOrWhiteSpace($env:PANOS_HOSTNAME)) { throw "PANOS_HOSTNAME is required" }
          if ([string]::IsNullOrWhiteSpace($env:PANOS_USERNAME)) { throw "PANOS_USERNAME is required" }
          if ([string]::IsNullOrWhiteSpace($env:PANOS_PASSWORD)) { throw "PANOS_PASSWORD is required" }

          function Invoke-PanosApi {
            param([string]$Type, [string]$Key, [string]$Command, [string]$Action = "")
            $arguments = @(
              "--silent", "--show-error", "--fail", "--insecure", "--request", "POST",
              "--data-urlencode", "type=$Type",
              "--data-urlencode", "key=$Key",
              "--data-urlencode", "cmd=$Command"
            )
            if ($Action) { $arguments += @("--data-urlencode", "action=$Action") }
            $arguments += $apiUrl
            $content = & curl.exe @arguments
            if ($LASTEXITCODE -ne 0) { throw "Panorama API request failed" }
            return ([xml]($content -join "`n"))
          }

          function Get-PanosJobId {
            param([xml]$Response)
            foreach ($xpath in @("/response/result/job", "/response/result/jobid", "/response/result/job-id")) {
              $node = $Response.SelectSingleNode($xpath)
              if ($node -and $node.InnerText) { return $node.InnerText }
            }
            $match = [regex]::Match($Response.OuterXml, "(?i)job(?:\s*id)?\s*[:=]?\s*(\d+)")
            if ($match.Success) { return $match.Groups[1].Value }
            return $null
          }

          function Wait-PanosJob {
            param([string]$Key, [string]$JobId, [string]$Description)
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              Start-Sleep -Seconds 10
              $response = Invoke-PanosApi "op" $Key "<show><jobs><id>$JobId</id></jobs></show>"
              $job = $response.response.result.job
              Write-Output "$Description job $JobId status: $($job.status)"
              if ($job.status -eq "FIN") {
                if ($job.result -ne "OK") { throw "$Description failed: $($response.OuterXml)" }
                Write-Output "$Description job $JobId completed successfully."
                return
              }
            }
            throw "$Description job $JobId did not finish within 5 minutes"
          }

          $keygenArguments = @(
            "--silent", "--show-error", "--fail", "--insecure", "--request", "POST",
            "--data-urlencode", "type=keygen",
            "--data-urlencode", "user=$env:PANOS_USERNAME",
            "--data-urlencode", "password=$env:PANOS_PASSWORD",
            $apiUrl
          )
          $keygenContent = & curl.exe @keygenArguments
          if ($LASTEXITCODE -ne 0) { throw "Panorama API key generation request failed" }
          $key = ([xml]($keygenContent -join "`n")).response.result.key
          if ([string]::IsNullOrWhiteSpace($key)) { throw "Panorama did not return an API key" }

          function Is-PanosNoChanges {
            param([xml]$Response)
            $messageText = ($Response.SelectNodes("//msg") | ForEach-Object { $_.InnerText }) -join " "
            if ([string]::IsNullOrWhiteSpace($messageText)) { $messageText = $Response.OuterXml }
            return ($Response.response.status -eq "success" -and $messageText -match "(?i)no changes|same as the previous commit|no edits have been made")
          }

          $candidate = Invoke-PanosApi "commit" $key "<commit><description>$description</description><partial><device-group><entry name='$deviceGroup'/></device-group></partial></commit>"
          $candidateJobId = Get-PanosJobId $candidate
          if ($candidateJobId) {
            Wait-PanosJob $key $candidateJobId "Panorama $deviceGroup candidate commit"
          } elseif (Is-PanosNoChanges $candidate) {
            Write-Output "Panorama reports no new $deviceGroup candidate changes. Running forced Panorama commit."
            $forced = Invoke-PanosApi "commit" $key "<commit><description>$description (force)</description><force></force></commit>"
            $forcedJobId = Get-PanosJobId $forced
            if ($forcedJobId) {
              Wait-PanosJob $key $forcedJobId "Panorama forced commit"
            } else {
              throw "Panorama forced commit failed or returned no job ID: $($forced.OuterXml)"
            }
          } else {
            throw "Panorama candidate commit failed: $($candidate.OuterXml)"
          }
