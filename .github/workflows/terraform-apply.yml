name: Terraform Apply

on:
  push:
    branches: [ main ]

concurrency:
  group: panorama-dg1-apply
  cancel-in-progress: false

jobs:
  plan:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan
        run: terraform plan -input=false -parallelism=1

  apply:
    needs: plan
    runs-on: self-hosted
    environment: panorama-production
    timeout-minutes: 15
    env:
      TF_VAR_panorama-server: ${{ secrets.PANOS_HOSTNAME }}
      TF_VAR_device-group: DG1
      TF_VAR_password: ${{ secrets.PANOS_PASSWORD }}
      TF_VAR_username: ${{ secrets.PANOS_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Check PAN-OS connectivity
        shell: powershell
        run: |
          if (-not (Test-NetConnection -ComputerName ${env:TF_VAR_panorama-server} -Port 443 -InformationLevel Quiet)) {
            throw "Cannot reach PAN-OS at ${env:TF_VAR_panorama-server} on TCP 443"
          }

      - name: Terraform Plan after approval
        run: terraform plan -input=false -parallelism=1 -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -parallelism=1 -auto-approve tfplan

      - name: Push production configuration to Panorama DG1
        shell: powershell
        run: |
          $apiUrl = "https://${env:TF_VAR_panorama-server}/api"
          $keygenContent = & curl.exe --silent --show-error --fail --insecure --request POST `
            --data-urlencode "type=keygen" `
            --data-urlencode "user=$env:TF_VAR_username" `
            --data-urlencode "password=$env:TF_VAR_password" `
            $apiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Panorama API key generation request failed"
          }
          $key = ([xml]$keygenContent).response.result.key
          if ([string]::IsNullOrWhiteSpace($key)) {
            throw "Panorama did not return an API key"
          }

          function Invoke-PanosApi {
            param([hashtable]$Parameters)
            $arguments = @('--silent', '--show-error', '--fail', '--insecure', '--request', 'POST')
            foreach ($parameter in $Parameters.GetEnumerator()) {
              $arguments += '--data-urlencode'
              $arguments += "$($parameter.Key)=$($parameter.Value)"
            }
            $arguments += $apiUrl
            $content = & curl.exe @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Panorama API request failed"
            }
            return $content
          }

          function Get-PanosJobId {
            param([xml]$Response)
            $jobId = $Response.SelectSingleNode("/response/result/job").InnerText
            if ([string]::IsNullOrWhiteSpace($jobId)) {
              $jobId = $Response.SelectSingleNode("/response/result/jobid").InnerText
            }
            if ([string]::IsNullOrWhiteSpace($jobId)) {
              $jobId = $Response.SelectSingleNode("/response/result/job-id").InnerText
            }
            if ([string]::IsNullOrWhiteSpace($jobId)) {
              $match = [regex]::Match($Response.InnerText, "(?i)job(?:\s*id)?\s*[:=]?\s*(\d+)")
              if ($match.Success) {
                $jobId = $match.Groups[1].Value
              }
            }
            return $jobId
          }

          function Wait-PanosJob {
            param([string]$JobId, [string]$Description)
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              Start-Sleep -Seconds 10
              $jobResponse = [xml](Invoke-PanosApi @{
                type = "op"
                key = $key
                cmd = "<show><jobs><id>$JobId</id></jobs></show>"
              })
              $job = $jobResponse.response.result.job
              Write-Output "$Description job $JobId status: $($job.status)"
              if ($job.status -eq "FIN") {
                if ($job.result -ne "OK") {
                  throw "$Description job failed: $($jobResponse.OuterXml)"
                }
                Write-Output "$Description job $JobId completed successfully."
                return
              }
            }
            throw "$Description job $JobId did not finish within 5 minutes"
          }

          $commitResponse = [xml](Invoke-PanosApi @{
            type = "commit"
            key = $key
            cmd = "<commit><description>Terraform apply $env:GITHUB_SHA</description><partial><device-group><entry name='DG1'/></device-group></partial></commit>"
          })
          $commitJobId = Get-PanosJobId $commitResponse
          if ($commitResponse.response.code -eq "13") {
            Write-Output "Panorama has no new DG1 candidate changes; continuing to push the already committed DG1 configuration."
          } elseif ($commitResponse.response.status -ne "success" -or [string]::IsNullOrWhiteSpace($commitJobId)) {
            throw "Panorama candidate commit failed or returned no job ID: $($commitResponse.OuterXml)"
          } else {
            Wait-PanosJob $commitJobId "Panorama DG1 candidate commit"
          }

          Write-Output "Starting full production push of Panorama DG1 configuration to managed firewalls."
          $pushResponse = [xml](Invoke-PanosApi @{
            type = "commit"
            key = $key
            cmd = "<commit-all><shared-policy><device-group><entry name='DG1'><include-template>true</include-template></entry></device-group></shared-policy></commit-all>"
          })
          if ($pushResponse.response.status -ne "success") {
            throw "Panorama DG1 push-to-device request failed: $($pushResponse.OuterXml)"
          }
          $pushJobId = Get-PanosJobId $pushResponse
          if ([string]::IsNullOrWhiteSpace($pushJobId)) {
            $pushMessage = $pushResponse.SelectSingleNode("/response/msg").InnerText
            if ([string]::IsNullOrWhiteSpace($pushMessage)) {
              $pushMessage = $pushResponse.InnerText
            }
            if ($pushResponse.response.code -in @("13", "19") -and $pushMessage -match "(?i)same as the previous commit|no edits have been made|no changes") {
              Write-Output "Panorama reports that DG1 is already synchronized with the managed firewalls."
              exit 0
            }
            throw "Panorama did not return a DG1 push job ID: $($pushResponse.OuterXml)"
          }
          Wait-PanosJob $pushJobId "Panorama DG1 full production push"
